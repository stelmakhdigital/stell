services:
  runtime:
    image: alpine:3.20
    command: ["echo", "build runtime with: go run ./cmd/runtime"]
    # Replace with a real image that runs cmd/runtime.
    expose: ["8081"]
    deploy:
      replicas: 2
    environment:
      STELL_HMAC_KEY: ${STELL_HMAC_KEY:-dev-hmac}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      retries: 3

  brain:
    image: alpine:3.20
    command: ["echo", "build brain with: go run ./cmd/gateway"]
    ports: ["8080:8080"]
    environment:
      STELL_API_TOKEN: ${STELL_API_TOKEN:-dev-token}
      STELL_HMAC_KEY: ${STELL_HMAC_KEY:-dev-hmac}
    volumes:
      - sessions:/data/sessions
    depends_on:
      - runtime

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8081:8081"]
    depends_on:
      - runtime

volumes:
  sessions:
